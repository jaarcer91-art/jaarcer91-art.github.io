ies like these move hundreds of thousands of dollars a month across borders, and in much of LATAM they do it through local banks that charge 5 to 10% to send money abroad, take days, and ask for paperwork at every step. Olie Business is the account they should have had: details in the company’s own name, dollars and euros, and payments to the world from one balance.\"}}]]}]\n26:[\"$\",\"div\",\"1\",{\"className\":\"op-wide\",\"children\":[[\"$\",\"$L47\",\"0\",{\"block\":{\"type\":\"brief\",\"columns\":[{\"title\":\"Problem to solve\",\"groups\":[{\"label\":\"Customer pain\",\"items\":[\"Paying a supplier abroad costs 5 to 10% at a local bank above $1,000, and takes days.\",\"Customers abroad cannot pay the company in dollars or euros without an intermediary.\",\"Opening an account abroad means travel, a local entity, or months of paperwork.\"]},{\"label\":\"Business pain\",\"items\":[\"Olie’s consumer apps earn small amounts per person. One company can move more than a hundred members.\",\"A first portal existed, but it had never been linked publicly and could not be trusted with a real company.\"]}]},{\"title\":\"Product strategy\",\"groups\":[{\"label\":\"Win the big movers first\",\"items\":[\"Exporters and importers: cattle, timber, grain, wine, fuel, machinery. Not small shops.\",\"Anchor the price on what their bank charges, not on what a startup charges.\"]},{\"label\":\"Reuse what already works\",\"items\":[\"Olie Vault on the web became the spec for every money flow, so the company account behaves like the app members already trust.\",\"Plans reuse the Vault catalogue, so there is one price list across Olie.\"]}]}]}}]]}]\n27:[\"$\",\"div\",\"2\",{\"className\":\"op-wide\",\"children\":[[\"$\",\"$L47\",\"0\",{\"block\":{\"type\":\"metrics\",\"items\":[{\"value\":\"1 month\",\"label\":\"From launch to an oil and gas importer as a client\"},{\"value\":\"$$500K\",\"label\":\"Per bank transfer, with no monthly cap\"},{\"value\":\"2\",\"label\":\"Currencies of a _next_f.push([1,"3a:[\"$\",\"div\",\"21\",{\"className\":\"op-wide\",\"children\":[[\"$\",\"$L47\",\"0\",{\"block\":{\"type\":\"sims\",\"title\":\"A panel of companies, before the first real one\",\"method\":[\"5 personas\",\"3 rounds\",\"Real screens and copy\",\"Reviewed by a second pass\"],\"personas\":[{\"name\":\"Rodrigo\",\"role\":\"Owner, cattle exporter\"},{\"name\":\"Carla\",\"role\":\"Finance director, importer\"},{\"name\":\"Marta\",\"role\":\"Our compliance reviewer\"},{\"name\":\"Luis\",\"role\":\"External accountant\"},{\"name\":\"Ana\",\"role\":\"New hire, prepares payments\"}],\"rounds\":[{\"label\":\"Open the account\",\"task\":\"“Open a dollar account for my company so my buyer in Miami can pay us.”\",\"results\":[{\"who\":\"Rodrigo\",\"outcome\":\"quit\",\"note\":\"Did not know which papers counted\"},{\"who\":\"Carla\",\"outcome\":\"stalled\",\"note\":\"Uploaded the wrong registration\"},{\"who\":\"Marta\",\"outcome\":\"stalled\",\"note\":\"Could not tell what was missing\"},{\"who\":\"Luis\",\"outcome\":\"done\",\"note\":\"Knew the documents by heart\"},{\"who\":\"Ana\",\"outcome\":\"quit\",\"note\":\"Waited for the owner\"}],\"quotes\":[{\"who\":\"Rodrigo\",\"text\":\"It says “company documents”. Which ones? My company is a Bolivian SRL, not a US LLC.\"},{\"who\":\"Marta\",\"text\":\"I can approve or reject the whole company, but I cannot say “only the power of attorney is wrong”.\"}],\"feedback\":\"One generic upload box fails everyone formed outside the US, and it fails the reviewer too. The words never name a document, so each persona guesses. The pattern is the same in every transcript: the drop happens at the upload screen, not at sign up.\",\"found\":\"Onboarding is paperwork, and the paperwork depends on the country the company was formed in.\",\"changed\":\"Documents chosen by country of formation, six for Bolivia and seven for the rest of the world, each reviewed one by one, with an email that lists exactly what is missing.\"},{\"label\":\"Pay a supplier\",\"task\":\"“Pay $52,300 to our supplier in Rotterdam today.”\",\"results\":[{\"who\":\"Rodrigo\",\"outcome\":\"done\",\"note\":\"Fast, once he saw the total\"},{\"who\":\"Carla\",\"outcome\":\"stalled\",\"note\":\"Wanted the fee before sending\"},{\"who\":\"Marta\",\"outcome\":\"done\",\"note\":\"Checked the destination\"},{\"who\":\"Luis\",\"outcome\":\"stalled\",\"note\":\"Needed a receipt with a name on it\"},{\"who\":\"Ana\",\"outcome\":\"done\",\"note\":\"Followed the keypad\"}],\"quotes\":[{\"who\":\"Carla\",\"text\":\"Is the fee taken from the $52,300 or added on top? What does the supplier actually receive?\"},{\"who\":\"Luis\",\"text\":\"At month end I need to know who sent this, not just that it was sent.\"}],\"feedback\":\"Trust breaks at the review step, not at the amount. Every persona that handles money for others asks the same two questions: what arrives, and who did it. Large amounts raise the stakes without adding any protection.\",\"found\":\"A company will not press send without seeing the fee, what arrives and who is responsible.\",\"changed\":\"The review shows the fee and exactly what arrives at the bank, receipts say who started the payment, and anything from $10,000 asks for an email code.\"},{\"label\":\"Work as a team\",\"task\":\"“Let my assistant prepare payments, but nothing leaves without me.”\",\"results\":[{\"who\":\"Rodrigo\",\"outcome\":\"stalled\",\"note\":\"Found only one kind of access\"},{\"who\":\"Carla\",\"outcome\":\"quit\",\"note\":\"Would not share her own login\"},{\"who\":\"Marta\",\"outcome\":\"done\",\"note\":\"Not part of the team\"},{\"who\":\"Luis\",\"outcome\":\"stalled\",\"note\":\"Wanted read only\"},{\"who\":\"Ana\",\"outcome\":\"stalled\",\"note\":\"Unsure what she was allowed to do\"}],\"quotes\":[{\"who\":\"Carla\",\"text\":\"If the only option is giving my accountant my password, we will not use this.\"},{\"who\":\"Ana\",\"text\":\"Can I press send, or will that get me in trouble?\"}],\"
