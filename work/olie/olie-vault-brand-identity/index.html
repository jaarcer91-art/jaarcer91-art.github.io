like a place built to last: calm, warm, unhurried, with gold used the way a private bank uses it. Sparingly, and only where it means something. This is the look, and the rules behind it.\"}}]]}]\n30:[\"$\",\"div\",\"1\",{\"className\":\"op-wide\",\"children\":[[\"$\",\"$L3f\",\"0\",{\"block\":{\"type\":\"image\",\"src\":\"/work/olie/brand/olie-vault-logo.svg\",\"alt\":\"The Olie Vault logo: the six-petal Olie mark, the word Olie and the word Vault, all in champagne gold on a warm black\",\"caption\":\"The Olie Vault lockup, in champagne gold.\",\"panel\":\"#0D0B08\",\"maxWidth\":360}}]]}]\n31:[\"$\",\"div\",\"2\",{\"className\":\"op-col\",\"children\":[[\"$\",\"$L3f\",\"0\",{\"block\":{\"type\":\"h2\",\"id\":\"gold\",\"text\":\"One gold, used like a signature\"}}],[\"$\",\"$L3f\",\"1\",{\"block\":{\"type\":\"p\",\"text\":\"There is one accent: champagne gold, #CFB97D. It colours the logo, the dollar sign and the few details that deserve it. A brighter gold exists for exactly one job, the lit point at the end of the net worth and Grow charts, and nothing else may use it.\"}}]]}]\n32:[\"$\",\"div\",\"3\",{\"className\":\"op-wide\",\"children\":[[\"$\",\"$L3f\",\"0\",{\"block\":{\"type\":\"swatches\",\"items\":[{\"name\":\"Champagne gold\",\"hex\":\"#CFB97D\",\"role\":\"The accent: logo, dollar sign, details\"},{\"name\":\"Soft gold\",\"hex\":\"#E1D4AE\",\"role\":\"The light end of gold gradients\"},{\"name\":\"Chart gold\",\"hex\":\"#FFE08A\",\"role\":\"The end point of two charts, nowhere else\"},{\"name\":\"Ground\",\"hex\":\"#0D0B08\",\"role\":\"Every screen\"},{\"name\":\"Raised\",\"hex\":\"#1C1A17\",\"role\":\"Cards, lists, banners\"},{\"name\":\"Dust gold\",\"hex\":\"#D3C29C\",\"role\":\"Most specks of gold dust\"},{\"name\":\"Dust cream\",\"hex\":\"#F4ECDB\",\"role\":\"The nearest specks\"},{\"name\":\"Metallic gold\",\"hex\":\"linear-gradient(105deg, #6E695E 0%, #F5EBCF 38%, #CFB97D 62%, #6E695E 100%)\",\"role\":\"Headlines on the Olie Vault website\"}]}}]]}]\n33:[\"$\",\"div\",\"4\",{\"className\":\"op-col\",\"children\":[[\"$\",\"$L3f\",\"0\",{\"block\":{\"type\":\"h2\",\"id\":\"glow\",\"text\":\"A warm black, lit from above\"}}],[\"$\",\"$L3f\",\"1\",{\"block\":{\"type\":\"p\",\"text\":\"No screen is flat black. Home carries a soft brown glow at the top, #2B2117, that fades out before the middle of the screen over an even deeper black. Account screens such as Cash and Grow glow from a little lower. The Olie Vault website uses the same field, so the site and the app feel like the same room.\"}}]]}]\n34:[\"$\",\"div\",\"5\",{\"className\":\"op-wide\",\"children\":[[\"$\",\"$L3f\",\"0\",{\"block\":{\"type\":\"image\",\"src\":\"/work/olie/app/vault-chart.jpg\",\"maxWidth\":620,\"alt\":\"The Olie Vault net worth chart: a thin gold line with gold dust beneath it and one glowing gold point at the end\",\"caption\":\"The net worth chart: a gold line, dust beneath it, and one lit point for today.\",\"panel\":\"#0D0B08\",\"sample\":true}}]]}]\n"])</script><script>self.__next_f.push([1,"35:[\"$\",\"div\",\"6\",{\"className\":\"op-col\",\"children\":[[\"$\",\"$L3f\",\"0\",{\"block\":{\"type\":\"h2\",\"id\":\"type\",\"text\":\"Three typefaces, three jobs\"}}],[\"$\",\"$L3f\",\"1\",{\"block\":{\"type\":\"p\",\"text\":\"Words are Inter. Every dollar figure is Space Grotesk 500, digits and the symbols bound to them. Dollars and cents sit at the same size; the dollar sign is the small part, 0.56 of the figure, in gold, raised 0.16 em off the baseline. Crypto figures take IBM Plex Mono 300, and a Bitcoin balance stays in mono even when you view it in dollars, so one balance never looks like two.\"}}],[\"$\",\"$L3f\",\"2\",{\"block\":{\"type\":\"typeScale\",\"items\":[{\"role\":\"Amount entry\",\"family\":\"grotesk\",\"size\":52,\"weight\":500,\"tracking\":-1.82,\"sample\":\"$$2,500\"},{\"role\":\"Hero balance\",\"family\":\"grotesk\",\"size\":50,\"weight\":500,\"tracking\":-1.75,\"sample\":\"$$5,000.00\"},{\"role\":\"Account balance\",
