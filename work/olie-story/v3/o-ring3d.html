<!doctype html>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
<body><div id="stage"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
<style>#gl,#ov{position:absolute;inset:0}</style>
<script src="kit.js"></script>
<script type="module">
// OLIE VERSION of the construction ring (9.03s): stablecoin addresses, and the 2.8% that hold more than $100.
// Same camera, timing and build as the 1:1 copy; white and grey glass instead of purple.
// 1:1 of the construction ring (9.03s, 1464x822). Seen from straight above: one hairline circle with
// four ticks, a second circle grows from it; the camera closes in on the lower left and radial divider
// pairs with square handles draw in with their percentages; the dividers become 3D outlines as the
// camera tilts; purple glass fills the slices one after another round the ring; the camera drops low
// in front, the far slice lifts and "Growth / CRM 1.01%" appears; cut back to the circle from above.
import * as THREE from 'three';
import { RoomEnvironment } from './lib/RoomEnvironment.js';
const W = 1250, H = 702;
const stage = boot({ w: W, h: H, scale: 1.6, dur: 9.03, fps: 30 });
stage.style.background = '#000';
const glc = document.getElementById('gl'), ov = document.getElementById('ov');
ov.width = W * 2; ov.height = H * 2; ov.style.width = W + 'px'; ov.style.height = H + 'px';
const c = ov.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(1.5, window.devicePixelRatio || 1.5)); renderer.setSize(W, H, false); glc.style.width = W + 'px'; glc.style.height = H + 'px';
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.5;
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 400);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(-6, 14, 10); scene.add(key);

// the ring: slices clockwise from the far side (the one that lifts), shares in percent
const R1 = 7.6, R2 = 10, TH = 1.0, GAPA = 0.04;
const SHARES = [2.8, 7, 8, 7, 8, 7, 7, 8, 7, 8, 7, 8, 7.6, 7.6];
const tot = SHARES.reduce((a, b) => a + b, 0);
// colour runs from deep violet on the right to pale lavender on the left

const slices = [];
let a = Math.PI / 2 - (SHARES[0] / tot) * Math.PI;        // centre the first slice on the far side (+z is near, -z far)
SHARES.forEach((sh, i) => {
  const span = (sh / tot) * Math.PI * 2;
  const a0 = a + GAPA / 2, a1 = a + span - GAPA / 2;
  a += span;
  const shape = new THREE.Shape();
  shape.absarc(0, 0, R2, a0, a1, false); shape.absarc(0, 0, R1, a1, a0, true); shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: TH, bevelEnabled: true, bevelThickness: 0.16, bevelSize: 0.16, bevelSegments: 4, curveSegments: 48 });
  geo.rotateX(-Math.PI / 2);                              // lie flat, extruded upward
  const sideK = (Math.cos(a - span / 2) + 1) / 2, col = i === 0 ? new THREE.Color('#FFFFFF') : new THREE.Color('#E6E6E6').lerp(new THREE.Color('#3C3C3C'), Math.min(1, Math.max(0, (Math.cos(a - span / 2) + 1.25) / 1.5)) ** 1.2);
  const mat = new THREE.MeshPhysicalMaterial({ color: col, roughness: 0.3, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05, transparent: true, opacity: 0, emissive: col.clone(), emissiveIntensity: 0.38, envMapIntensity: 0.5 });
  const m = new THREE.Mesh(geo, mat);
  scene.add(m);
  slices.push({ m, mat, a0, a1, sh, i, mid: (a0 + a1) / 2 });
});
// angles here run in the XZ plane: x = cos(a)*r, z = -sin(a)*r (after the rotation above)
const ringPt = (r, ang, y = 0) => new THREE.Vector3(Math.cos(ang) * r, y, -Math.sin(ang) * r);
const toScreen = (v) => { const p = v.clone().project(camera); return [(p.x + 1) / 2 * W, (1 - p.y) / 2 * H, p.z]; };

// camera keys: [time, polar angle from straight down, azimuth, distance, target x, y, z, fov]
const KEYS = [
  [0.0, 0.001, 0, 43, 0, 0, 0, 30],
  [1.4, 0.001, 0, 41, 0, 0, 0.6, 30],
  [1.8, 0.001, 0.05, 30, -0.6, 0, 3.6, 30],
  [2.1, 0.02, 0.15, 21, -5.2, 0, 5.2, 30],
  [3.45, 0.05, 0.22, 20, -5.0, 0, 5.6, 30],
  [3.75, 0.35, 0.15, 21, -3.6, 0, 6.2, 30],
  [4.15, 1.08, -0.35, 15.5, 1.8, 0, 7.0, 30],
  [4.9, 1.12, -0.05, 15.0, 0.4, 0, 7.4, 30],
  [5.37, 0.98, 0.1, 25, 0.6, 0, 2.6, 30],
  [5.6, 1.05, 0.45, 20, -1.0, 0, 1.0, 30],
  [5.85, 1.12, 0.05, 23, 0, 0.6, -2.5, 30],
  [6.25, 1.3, 0, 15.5, 0, 1.3, -6.8, 30],
  [7.7, 1.31, 0.03, 15.2, 0, 1.35, -7.0, 30],
];
// one continuous camera move: a spline through the keys (velocity carries through each key instead of
// easing to a stop there), with an ease only at the very start and end
const DIMS = KEYS[0].length;
const tan = KEYS.map((k, i) => k.map((v, j) => {
  if (j === 0 || i === 0 || i === KEYS.length - 1) return 0;
  const a = KEYS[i - 1], b = KEYS[i + 1]; return (b[j] - a[j]) / (b[0] - a[0]) * 0.85;
}));
function camAt(t) {
  t = clamp(t, KEYS[0][0], KEYS[KEYS.length - 1][0]);
  let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1][0]) i++;
  const A = KEYS[i], B = KEYS[i + 1], dt = B[0] - A[0], u = clamp((t - A[0]) / dt);
  const u2 = u * u, u3 = u2 * u, h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u, h01 = -2 * u3 + 3 * u2, h11 = u3 - u2;
  const k = A.map((v, j) => h00 * v + h10 * dt * tan[i][j] + h01 * B[j] + h11 * dt * tan[i + 1][j]);
  const [, polR, az, dist, tx, ty, tz, fov] = k;
  const pol = Math.max(0.001, polR);
  const target = new THREE.Vector3(tx, ty, tz);
  const pos = new THREE.Vector3(Math.sin(pol) * Math.sin(az) * dist, Math.cos(pol) * dist, Math.sin(pol) * Math.cos(az) * dist).add(target);
  // the up vector turns smoothly from "screen up = far side" (looking down) to world up as the camera tilts
  const w = clamp((pol - 0.1) / 0.25); camera.up.set(0, w, -(1 - w)).normalize();
  camera.position.copy(pos); camera.fov = fov;
  camera.lookAt(target); camera.updateProjectionMatrix(); camera.updateMatrixWorld(true);
}
function circle(r, y, alpha, from = 0, to = Math.PI * 2) {
  c.globalAlpha = alpha; c.beginPath();
  for (let k = 0; k <= 180; k++) { const ang = from + (to - from) * k / 180; const [x, yy] = toScreen(ringPt(r, ang, y)); k ? c.lineTo(x, yy) : c.moveTo(x, yy); }
  c.stroke(); c.globalAlpha = 1;
}
slices.forEach((sl) => { sl.m.visible = true; sl.mat.opacity = 1; }); camAt(5); renderer.compile(scene, camera); renderer.render(scene, camera);
window.ready = fontsReady(['400 22px Inter', '400 40px Inter']);
window.setTime = (t) => {
  const top = t < 7.85;
  camAt(top ? t : 0);
  c.setTransform(2, 0, 0, 2, 0, 0); c.clearRect(0, 0, W, H);
  c.strokeStyle = 'rgba(255,255,255,.62)'; c.lineWidth = 1.1; c.fillStyle = '#e6e6e6';
  const T = top ? t : 0;
  // 1. the circles from above
  const second = seg(T, 0.3, 1.25, E.io4);
  const hair = top ? 1 - seg(T, 4.7, 5.5, E.lin) : seg(t, 7.9, 8.35, E.lin);
  circle(R2, TH, hair);
  if (second > 0) circle(lerp(R2, R1, second), TH, hair);
  if (T < 1.9) { [0, 1, 2, 3].forEach((k) => { const ang = k * Math.PI / 2; const [x, y] = toScreen(ringPt(R2, ang, TH)); c.globalAlpha = hair; c.fillRect(x - 2.5, y - 2.5, 5, 5); const [x2, y2] = toScreen(ringPt(lerp(R2, R1, second), ang, TH)); if (second > 0.05) c.fillRect(x2 - 2.5, y2 - 2.5, 5, 5); c.globalAlpha = 1; }); }
  // 2. dividers with square handles, percentages
  const div = seg(T, 2.05, 2.7, E.o3) * (1 - seg(T, 3.6, 3.95, E.lin));
  const outline = seg(T, 3.6, 4.0, E.o3) * (1 - seg(T, 5.2, 5.9, E.lin));
  slices.forEach((s) => {
    [s.a0, s.a1].forEach((ang, k) => {
      if (div > 0.01) {
        const p = toScreen(ringPt(R2, ang, TH)), q = toScreen(ringPt(R1, ang, TH));
        c.globalAlpha = div; c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(lerp(p[0], q[0], clamp(div * 1.3)), lerp(p[1], q[1], clamp(div * 1.3))); c.stroke();
        c.fillRect(p[0] - 5, p[1] - 5, 10, 10); if (div > 0.75) c.fillRect(q[0] - 5, q[1] - 5, 10, 10); c.globalAlpha = 1;
      }
      if (outline > 0.01) {
        c.globalAlpha = outline * 0.7;
        [[R2, 0], [R2, TH], [R1, TH]].forEach(([r, y]) => { const p = toScreen(ringPt(r, ang, y)); const q = toScreen(ringPt(r === R2 && y === 0 ? R2 : r, ang, y === 0 ? TH : 0)); c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); c.stroke(); });
        const p = toScreen(ringPt(R2, ang, TH)), q = toScreen(ringPt(R1, ang, TH)); c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); c.stroke();
        c.globalAlpha = 1;
      }
    });
    if (outline > 0.01) { c.globalAlpha = outline * 0.7; c.beginPath(); for (let k = 0; k <= 24; k++) { const ang = lerp(s.a0, s.a1, k / 24); const [x, y] = toScreen(ringPt(R2, ang, 0)); k ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke(); c.globalAlpha = 1; }
    if (div > 0.3) { const [x, y] = toScreen(ringPt((R1 + R2) / 2, s.mid, TH)); c.globalAlpha = div; c.font = '400 22px Inter'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#e8e8e8'; if (s.i === 0) c.fillText(s.sh + '%', x, y); c.globalAlpha = 1; c.fillStyle = '#e6e6e6'; }
  });
  // 3. glass fills, one slice after another, starting on the right and running round
  const order = (s) => { let d = ((-0.45 - s.mid) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2); return d / (Math.PI * 2); };
  const lift = seg(T, 6.25, 6.75, E.io4);
  slices.forEach((s) => {
    const st = 4.15 + order(s) * 1.65;
    const f = top ? seg(T, st, st + 0.35, E.o3) : 0;
    s.mat.opacity = Math.min(1, f * 3); s.m.visible = f > 0.01; s.m.scale.y = Math.max(0.02, f);
    s.m.position.y = s.i === 0 ? lift * 1.35 : 0;
    s.mat.emissiveIntensity = s.i === 0 ? 0.3 + 0.5 * lift : 0.12;
  });
  // 4. the inner dotted ring and the words
  const words = seg(T, 6.4, 6.9, E.o3) * (top ? 1 : 0);
  if (words > 0.01) {
    c.globalAlpha = words * 0.6; c.fillStyle = '#fff';
    for (let k = 0; k < 90; k++) { const ang = (k / 90) * Math.PI * 2; const [x, y] = toScreen(ringPt(R1 - 0.9, ang, 0)); c.fillRect(x - 0.8, y - 2, 1.6, 4); }
    c.globalAlpha = words; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.font = '400 22px Inter'; c.fillStyle = '#9a9a9a'; c.fillText('310M stablecoin addresses', W / 2, 0.155 * H);
    c.font = '400 40px Inter'; const w1 = c.measureText('Hold more than $100  ').width, w2 = c.measureText('2.8%').width, x0 = W / 2 - (w1 + w2) / 2;
    c.textAlign = 'left'; c.fillStyle = '#a8a8a8'; c.fillText('Hold more than $100  ', x0, 0.255 * H); c.fillStyle = '#fff'; c.fillText('2.8%', x0 + w1, 0.255 * H);
    c.globalAlpha = 1;
  }
  renderer.render(scene, camera);
};
</script>
